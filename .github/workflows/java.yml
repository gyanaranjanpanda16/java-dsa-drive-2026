name: Java learning examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and verify lessons
        run: bash scripts/test.sh
